services:
  postgres-db:
    image: postgres:16-alpine
    container_name: library-postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-library_books_db}
      POSTGRES_USER: ${DB_USER:-libuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-libpass_secure_123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-libuser} -d ${DB_NAME:-library_books_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  book-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: library-book-service
    restart: unless-stopped
    environment:
      PORT: ${PORT:-8001}
      APP_ENV: ${APP_ENV:-production}
      DB_HOST: postgres-db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-library_books_db}
      DB_USER: ${DB_USER:-libuser}
      DB_PASSWORD: ${DB_PASSWORD:-libpass_secure_123}
    ports:
      - "8001:8001"
    depends_on:
      postgres-db:
        condition: service_healthy

volumes:
  postgres_data:
